version: 2

sources:
  - name: fpl_raw
    schema: raw
    description: >
      FPL API responses as they landed (D16), appended by ingest/load.py: one snapshot per
      table per fetch date (D17). Lives in the same database as the models for each target
      (D19). Every source holds all dates; staging decides which date to keep.
    tables:
      - name: bootstrap_static
        description: Players, teams and gameweeks as of each fetch. Current state only. Every pull.
        columns:
          - name: dt
            tests: [unique, not_null]
      - name: fixtures
        description: Every fixture of the season as of each fetch. `payload` is the array. Every pull.
        columns:
          - name: dt
            tests: [unique, not_null]
      - name: element_summaries
        description: >
          One row per player per full pull; `history` holds one object per fixture played.
          Full pulls only, so its dates are a subset of bootstrap_static's.
        tests:
          - dbt_utils.unique_combination_of_columns:
              arguments: {combination_of_columns: [dt, element_id]}
      - name: history_player_gw
        description: >
          Past seasons from the vaastav/Fantasy-Premier-League archive (D43, D49): one row per
          player per fixture, every column text as landed. Loaded by ingest/fetch_history.py.
      - name: history_teams
        description: Archive teams per past season; `code` is FPL's stable cross-season team id.
      - name: history_fixtures
        description: Archive fixtures per past season.
      - name: history_players_raw
        description: Archive player list per past season; maps the season's element id to FPL's stable player `code`.

