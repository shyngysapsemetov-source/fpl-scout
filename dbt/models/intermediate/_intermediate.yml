version: 2

models:
  - name: int_team_fixtures
    description: One row per team per finished fixture, past seasons and this one; team xG = sum of player xG.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments: {combination_of_columns: [season, fixture_id, team_code]}
    columns:
      - name: xg_for
        tests: [not_null]

  - name: int_team_ratings
    description: Attack and defence ratings per team as of just before each fixture (see the model docstring).
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments: {combination_of_columns: [season, fixture_id, team_code]}
    columns:
      - name: attack
        tests:
          - not_null
          - dbt_utils.accepted_range: {arguments: {min_value: 0.3, max_value: 3}}
      - name: defence
        tests:
          - not_null
          - dbt_utils.accepted_range: {arguments: {min_value: 0.3, max_value: 3}}

  - name: int_player_fixture_points
    description: total_points split into 13 scoring categories (D23, D25, D27).
