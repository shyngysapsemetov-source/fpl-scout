version: 2

seeds:
  - name: scoring_thresholds
    description: >
      Scoring thresholds the API doesn't publish (D27). The point values come from
      stg_fpl__scoring_rules; these come from the official FPL rules page. One row per season,
      position and rule. `verified` turns true once a value has been checked against that
      season's rules. Positions a rule doesn't apply to have no row.
    config:
      column_types: {season: varchar, threshold: integer, verified: boolean}
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments: {combination_of_columns: [season, position_code, rule]}
    columns:
      - name: position_code
        tests:
          - accepted_values: {arguments: {values: [GKP, DEF, MID, FWD]}}
      - name: rule
        tests:
          - accepted_values:
              arguments:
                values: [long_play_minutes, saves_per_point, goals_conceded_per_point,
                         defensive_contribution_min]

  - name: team_colours
    description: >
      Club kit colours for the app's team badges (D65), keyed on FPL's stable team code.
      Display only; approximate primary/secondary kit colours. A promoted club needs a row.
    columns:
      - name: team_code
        tests: [unique, not_null]
      - name: primary_colour
        tests: [not_null]


  - name: scoring_rules_history
    description: >
      Points per scoring event per position for past seasons (D89), which the archive doesn't
      publish. Seeded from the rules as understood, and verified by
      assert_history_points_reconcile against every archive row's total_points; `verified`
      turns true once he confirms. The current season's rules come from the API instead.
    config:
      column_types: {season: varchar, points: integer, verified: boolean}
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments: {combination_of_columns: [season, position_code, rule]}
