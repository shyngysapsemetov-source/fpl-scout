# No secrets here, so it lives in the repo. Run dbt with --profiles-dir . from this folder.
#   dev  - your local file; rebuild and break it freely
#   prod - MotherDuck (D14, D22), built only by CI from main. DuckDB reads the token from the
#          MOTHERDUCK_TOKEN env var, which only CI has. Keep in step with ingest/db.py.
fpl_scout:
  target: dev
  outputs:
    dev:
      type: duckdb
      path: ../data/dev.duckdb
      threads: 4
    # Replay (D103): an as-of rebuild in its own file; agent/replay.py sets FPL_REPLAY_DB.
    replay:
      type: duckdb
      path: "{{ env_var('FPL_REPLAY_DB', '../data/agent/replay/dev.duckdb') }}"
      threads: 4
    prod:
      type: duckdb
      path: "md:fpl_scout"
      threads: 4
