name: fpl_scout
version: "0.1.0"
config-version: 2
profile: fpl_scout

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]
seed-paths: ["seeds"]
target-path: target
clean-targets: [target, dbt_packages]

vars:
  # Folder the ingest job writes to, relative to this dbt project.
  raw_path: "../data/raw"

models:
  fpl_scout:
    staging:
      +materialized: view
    intermediate:
      +materialized: view
    marts:
      +materialized: table
