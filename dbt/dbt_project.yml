name: fpl_scout
version: "0.1.0"
config-version: 2
profile: fpl_scout

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]
seed-paths: ["seeds"]
target-path: target
clean-targets: [target, dbt_packages]

vars:
  # Season key for seeds, matching the API's static_content_url (e.g. .../2026_27/).
  season: "2026_27"

models:
  fpl_scout:
    staging:
      +materialized: view
    intermediate:
      +materialized: view
    marts:
      +materialized: table
