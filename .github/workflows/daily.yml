name: daily build

on:
  schedule:
    - cron: "17 6 * * *"   # 06:17 UTC daily; Actions cron often runs 5-15 min late
  workflow_dispatch:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Fetch FPL API
        # PRs fetch a small sample; the scheduled run pulls every player.
        run: python ingest/fetch.py ${{ github.event_name == 'pull_request' && '--limit 40' || '' }}
      - name: dbt build
        working-directory: dbt
        run: |
          dbt deps --profiles-dir .
          dbt build --profiles-dir . --target ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && 'prod' || 'dev' }}
